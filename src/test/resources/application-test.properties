server.port = 8080
spring.application.name = Popco-Client

# ???? H2 ??????
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

# JPA ??
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# REDIS
spring.data.redis.host= localhost
spring.data.redis.port= 6379
spring.data.redis.password=${REDIS_PASSWORD}

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token.expire-time=300000
jwt.refresh-token.expire-time=1200000
jwt.threshold-time=600000

# Kakao
spring.kakao.auth.rest-api-key=${KAKAO_REST_API_KEY}
spring.kakao.auth.redirect=${KAKAO_REDIRECT}

# AWS
aws.s3.bucket-name=test-bucket-name
aws.s3.region=ap-northeast-2
aws.credentials.access-key=test-access-key
aws.credentials.secret-key=test-secret-key

